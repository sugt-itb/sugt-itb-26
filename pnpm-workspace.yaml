# Two apps, sharing packages — see docs/adr/0002-two-apps-in-a-pnpm-workspace.md.
#
# The ADR-0001 boundary (internal narrative never reaches a public page) is held
# by pnpm's default strict, symlinked node_modules: `@sugt/public` can only
# import packages it declares in its own package.json. Setting `node-linker=hoisted`
# or `shamefully-hoist=true` in an .npmrc would downgrade that boundary back to a
# convention. Don't.
packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared by both apps. Two Next apps drifting
# on React versions is exactly what this prevents; depend on `catalog:` not a range.
catalog:
  "@base-ui/react": ^1.7.0
  "@milkdown/kit": 7.22.1
  "@milkdown/react": 7.22.1
  "@supabase/supabase-js": ^2.112.3
  "@tailwindcss/postcss": ^4
  "@types/node": ^20
  "@types/qrcode": ^1.5.5
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vercel/speed-insights": ^2.0.0
  babel-plugin-react-compiler: 1.0.0
  # Pinned to the version docs/research/better-auth-capabilities.md was read against.
  # That file is a snapshot of the 1.6.27 bundles, not durable documentation: on a
  # version bump, re-read it rather than trust it. `auth` is the CLI, versioned in
  # lockstep — the older `@better-auth/cli` package has a stale `latest` tag.
  better-auth: ~1.6.27
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  lucide-react: ^1.31.0
  next: 16.2.12
  next-themes: ^0.4.6
  postgres: ^3.4.9
  qrcode: ^1.5.4
  react: 19.2.4
  react-dom: 19.2.4
  # The public Story renderer (@sugt/story-format/story-body). v9's peer is react >=18, which
  # 19.2.4 satisfies; it bundles the remark→hast pipeline so the render allowlist needs no
  # separate unified stack.
  react-markdown: ^9.1.0
  shadcn: ^4.16.1
  tailwind-merge: ^3.6.0
  tailwindcss: ^4
  tw-animate-css: ^1.4.0
  typescript: ^7
  vitest: ^4.1.10

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Written by pnpm, not by hand: the Better Auth line was published more recently than
# the store's minimum release age allows, and these entries are the recorded decision
# to install it anyway. Drop an entry when its version ages past the threshold.
minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.27"
  - "@better-auth/drizzle-adapter@1.6.27"
  - "@better-auth/kysely-adapter@1.6.27"
  - "@better-auth/memory-adapter@1.6.27"
  - "@better-auth/mongo-adapter@1.6.27"
  - "@better-auth/prisma-adapter@1.6.27"
  - "@better-auth/telemetry@1.6.27"
  - better-auth@1.6.27
  - "@milkdown/components@7.22.1"
  - "@milkdown/core@7.22.1"
  - "@milkdown/crepe@7.22.1"
  - "@milkdown/ctx@7.22.1"
  - "@milkdown/exception@7.22.1"
  - "@milkdown/kit@7.22.1"
  - "@milkdown/plugin-block@7.22.1"
  - "@milkdown/plugin-clipboard@7.22.1"
  - "@milkdown/plugin-cursor@7.22.1"
  - "@milkdown/plugin-diff@7.22.1"
  - "@milkdown/plugin-history@7.22.1"
  - "@milkdown/plugin-indent@7.22.1"
  - "@milkdown/plugin-listener@7.22.1"
  - "@milkdown/plugin-slash@7.22.1"
  - "@milkdown/plugin-streaming@7.22.1"
  - "@milkdown/plugin-tooltip@7.22.1"
  - "@milkdown/plugin-trailing@7.22.1"
  - "@milkdown/plugin-upload@7.22.1"
  - "@milkdown/preset-commonmark@7.22.1"
  - "@milkdown/preset-gfm@7.22.1"
  - "@milkdown/prose@7.22.1"
  - "@milkdown/react@7.22.1"
  - "@milkdown/transformer@7.22.1"
  - "@milkdown/utils@7.22.1"
